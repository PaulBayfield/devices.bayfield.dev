name: release

# Push a tag like v0.2.0 (matching "version" in package.json) to build the Windows desktop
# installers and attach them to that version's GitHub release (the one deployment.yaml publishes,
# created here first if this build gets there before it).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($version)"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The agent, as one executable the desktop app bundles and starts (a Tauri sidecar).
      - uses: astral-sh/setup-uv@v7

      - name: Build the agent
        run: npm run agent:build

      - name: Build the installers
        run: npm run tauri build
        env:
          # Signs the update artifacts the in-app updater installs (must match the pubkey in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # What the in-app updater reads (releases/latest/download/latest.json): the version, and the
      # NSIS installer with its signature.
      - name: Describe the update
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          exe=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          node -e '
            const fs = require("fs");
            const [exe, tag, repo] = process.argv.slice(1);
            const name = exe.split("/").pop();
            fs.writeFileSync("latest.json", JSON.stringify({
              version: tag.replace(/^v/, ""),
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature: fs.readFileSync(exe + ".sig", "utf8").trim(), url: `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(name)}` } },
            }, null, 2));
          ' "$exe" "$TAG" "$REPO"
          cat latest.json

      # The installer isn't code-signed: SmartScreen may ask to confirm (More info → Run anyway).
      - name: Attach them to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes || true
          gh release upload "$TAG" src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/*.exe.sig src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/msi/*.msi.sig latest.json --clobber
